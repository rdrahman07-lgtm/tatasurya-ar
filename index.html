<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR Tata Surya</title>
    <!-- Memuat pustaka A-Frame untuk rendering 3D -->
    <script src="https://aframe.io"></script>
    <!-- Memuat pustaka AR.js untuk pelacakan gambar/marker -->
    <script src="https://githack.com"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <!-- Mengaktifkan fitur AR dengan kamera belakang HP -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Menentukan Gambar Target (Marker HIRO) -->
      <a-marker preset="hiro">
        
        <!-- MATAHARI (Bola Besar Kuning di Tengah) -->
        <a-sphere position="0 0 0" radius="0.4" color="#FFD700" 
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
        </a-sphere>

        <!-- PLANET MERKURIUS -->
        <!-- Entity ini berfungsi sebagai poros rotasi mengitari matahari -->
        
          <a-sphere position="0.6 0 0" radius="0.05" color="#A9A9A9"></a-sphere>
        

        <!-- PLANET VENUS -->
        
          <a-sphere position="0.9 0 0" radius="0.08" color="#DEB887"></a-sphere>
        

        <!-- PLANET BUMI -->
        
          <!-- Bumi berwarna biru -->
          <a-sphere position="1.3 0 0" radius="0.09" color="#0000FF">
            <!-- Bulan (Berputar mengitari Bumi) -->
            
              <a-sphere position="0.15 0 0" radius="0.02" color="#FFFFFF"></a-sphere>
            
          </a-sphere>
        

        <!-- PLANET MARS -->
        
          <a-sphere position="1.7 0 0" radius="0.07" color="#FF4500"></a-sphere>
        

      </a-marker>

      <!-- Kamera AR -->
      
    </a-scene>
    
  </body>
</html>
